name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Lint workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install just
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c
        with:
          tool: just

      - name: Install cocogitto
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c
        with:
          tool: cocogitto

      - name: Check conventional commits (PR)
        if: github.event_name == 'pull_request'
        run: just commits "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

      - name: Check conventional commits (push)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: just commits "${{ github.event.before }}..${{ github.event.after }}"

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json

      - name: Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}-v1
          restore-keys: |
            ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}-
            ${{ runner.os }}-bun-

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: "./src-tauri -> target"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            mold

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # `just check` runs sync, tests, types, Biome and Clippy.
      - name: Check
        run: just check

      - name: Build frontend
        run: just frontend-build

      - name: Check cargo-deny
        uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd
        with:
          command: check
          log-level: warn
          manifest-path: src-tauri/Cargo.toml

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json

      - name: Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}-v1
          restore-keys: |
            ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}-
            ${{ runner.os }}-bun-

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # Windows ships an NSIS installer; compile it here so a release is not the first attempt.
      - name: Build binary
        run: bun run build
