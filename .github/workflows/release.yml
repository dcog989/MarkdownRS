name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      # sync_version.sh is idempotent: any diff means a manifest disagrees with the tag.
      - name: Manifests match the tag
        run: |
          bash scripts/sync_version.sh "${GITHUB_REF_NAME#v}"
          git diff --exit-code -- package.json src-tauri/Cargo.toml src-tauri/Cargo.lock PKGBUILD

      # A tag is pushed next to the main commit, so CI may still be running. Wait for it.
      - name: CI passed for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_id=''
          for _ in $(seq 1 24); do
            run_id=$(gh run list --workflow=ci.yml --commit "$GITHUB_SHA" --limit 1 --json databaseId --jq '.[0].databaseId')
            if [ -n "$run_id" ]; then break; fi
            sleep 5
          done
          if [ -z "$run_id" ]; then
            echo "::error::no CI run exists for $GITHUB_SHA"
            exit 1
          fi
          gh run watch "$run_id" --exit-status --interval 15

  notes:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      # Create the draft once so the matrix legs only upload assets and never race on the body.
      - name: Generate release notes
        uses: cocogitto/cocogitto-action@52d0023b4396897f1815648e553db2ab8d782f3a
        with:
          command: changelog
          args: --at ${{ github.ref_name }}

      # cog rewrites the whole changelog; the release body wants only this version's section.
      - name: Extract this version's notes
        run: |
          awk -v header="## $GITHUB_REF_NAME " '
            index($0, header) == 1 { keep = 1 }
            keep && /^## v[0-9]/ && index($0, header) != 1 { exit }
            keep
          ' CHANGELOG.md > notes.md

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes-file notes.md CHANGELOG.md
          fi

  publish:
    needs: [verify, notes]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json

      - name: Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}-v1
          restore-keys: |
            ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}-
            ${{ runner.os }}-bun-

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: "./src-tauri -> target"

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            mold

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build and upload
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseDraft: true

      # base-devel ships the keyring and makedepends; a full upgrade avoids the -Sy partial-upgrade window.
      - name: Build Arch package
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p .pkg
          cp PKGBUILD .pkg/
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace/.pkg \
            archlinux:base-devel \
            bash -c "
              pacman -Syu --noconfirm webkit2gtk-4.1 gtk3
              useradd -m builder
              chown -R builder:builder /workspace/.pkg
              su builder -c 'makepkg -f --noconfirm'
            "

      - name: Upload Arch package
        if: matrix.os == 'ubuntu-latest'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3
        with:
          draft: true
          files: .pkg/*.pkg.tar.zst
          fail_on_unmatched_files: true

  finalize:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    # No checkout here; GH_REPO gives `gh` the repository to target.
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download draft assets
        run: gh release download "$GITHUB_REF_NAME" --dir dist --clobber

      - name: Generate checksums
        run: |
          cd dist
          rm -f SHA256SUMS
          sha256sum -- * > SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: dist/*

      - name: Upload checksums
        run: gh release upload "$GITHUB_REF_NAME" dist/SHA256SUMS --clobber

      - name: Publish draft release
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
