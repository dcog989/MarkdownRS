name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact-name: bundles-linux
          - os: windows-latest
            artifact-name: bundles-windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev

      - name: Install frontend dependencies
        run: bun install

      - name: Build application
        run: bunx tauri build

      - name: Build Arch package
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        run: |
          mkdir -p .pkg
          cp PKGBUILD .pkg/
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace/.pkg \
            archlinux:latest \
            bash -c "
              pacman -Sy --noconfirm archlinux-keyring
              pacman -Su --noconfirm base-devel webkit2gtk-4.1 libnm
              useradd -m builder
              chown -R builder:builder /workspace
              su builder -c 'makepkg -f --noconfirm'
            "

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            src-tauri/target/release/bundle/**/*
            src-tauri/target/release/*.tar.gz
            src-tauri/target/release/latest.json
            .pkg/*.pkg.tar.zst

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v5

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: |
            bundles-linux/**/*
            bundles-windows/**/*
