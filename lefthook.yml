pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{js,ts,svelte,json,css}"
      run: bunx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true

    - name: rust-fmt
      glob: "*.rs"
      run: cd src-tauri && cargo fmt --check


pre-push:
  commands:
    full-check:
      run: bun run check
