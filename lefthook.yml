# pre-commit: format staged files and check Rust formatting
pre-commit:
  commands:
    biome:
      glob: '*.{js,ts,svelte,json,css}'
      run: bunx biome format --write --no-errors-on-unmatched --staged && git add -u
    rust-fmt:
      glob: '*.rs'
      run: cd src-tauri && cargo fmt -- --check

# pre-push: full lint check
pre-push:
  commands:
    lint:
      run: bun run lint

# commit-msg: enforce conventional commit format
commit-msg:
  commands:
    conventional:
      run: "grep -qE '^(feat|fix|chore|docs|refactor|test|perf|ci|style|revert)(\\(.+\\))?: .' {1}"
