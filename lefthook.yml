pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{js,ts,svelte,json,css}"
      run: just format-staged {staged_files}
      stage_fixed: true

    - name: rust-fmt
      glob: "*.rs"
      run: just format-rust-staged {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    # `just check` already runs the whole test suite; running it twice in parallel made the
    # view tests race their 50ms render budget and fail the push.
    full-check:
      run: just check

commit-msg:
  commands:
    cog:
      run: just commit-check {1}
