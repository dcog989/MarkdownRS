[package]
authors = ["dcog989"]
description = "The only Markdown editor you need."
edition = "2024"
name = "markdown-rs"
version = "0.24.0"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
anyhow = "1.0"
chardetng = "1.0"
chrono = "0.4"
comrak = "0.52"
dashmap = "6.2"
dirs = "6"
dprint-plugin-markdown = "0.22"
dunce = "1"
encoding_rs = "0.8"
gtk = "0.18"
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
path-clean = "1.0"
pdfrs = "0.1"
regex = "1.12"
reqwest = "0.13"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
spellbook = "0.4"
tauri = { version = "2.11", features = ["devtools"] }
tauri-plugin-clipboard-manager = "2.3"
tauri-plugin-dialog = "2.7"
tauri-plugin-fs = { version = "2.5", features = ["watch"] }
tauri-plugin-log = "2.8"
tauri-plugin-opener = "2.5"
tauri-plugin-shell = "2.3"
tauri-plugin-single-instance = "2.4"
tauri-plugin-store = "2.4"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2.4"
tokio = { version = "1", features = ["sync", "fs", "io-util"] }
toml = "1.1"
trash = "5.2"
unicode-bom = "2.0"
unicode-segmentation = "1.13"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.56"
