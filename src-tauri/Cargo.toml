[package]
authors = ["dcog989"]
description = "The only Markdown editor you need."
edition = "2024"
name = "markdown-rs"
version = "1.58.0"
license = "MIT OR Apache-2.0"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[features]
default = ["pdf-export", "spellcheck"]
pdf-export = ["dep:pdf_oxide"]
spellcheck = ["dep:reqwest"]

[dependencies]
anyhow = "1.0"
chardetng = "1.0"
chrono = "0.4"
comrak = "0.54"
dirs = "6"
harper-core = "2.8"
rumdl = "0.2"
dunce = "1"
encoding_rs = "0.8"
log = "0.4"
pdf_oxide = { version = "0.3", optional = true }
regex = "1.13"
reqwest = { version = "0.13", optional = true }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
spellbook = "0.4"
tauri = { version = "2.11", features = ["protocol-asset", "devtools"] }
tauri-plugin-clipboard-manager = "2.3"
tauri-plugin-dialog = "2.7"
tauri-plugin-fs = { version = "2.5", features = ["watch"] }
tauri-plugin-log = "2.9"
tauri-plugin-opener = "2.5"
tauri-plugin-shell = "2.3"
tauri-plugin-single-instance = "2.4"
tauri-plugin-store = "2.4"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2.4"
tokio = { version = "1", features = ["sync", "fs", "io-util"] }
toml = "1.1"
trash = "5.2"
unicode-segmentation = "1.13"
uuid = { version = "1", features = ["v4"] }
strum = { version = "0.28.0", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.56"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
