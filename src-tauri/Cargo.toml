[package]
name = "markdown-rs"
version = "1.61.2"
edition = "2024"
description = "The only Markdown editor you need."
license = "GPL-3.0-only"

[dependencies]
anyhow = "1.0"
chardetng = "1.0"
chrono = "0.4"
comrak = "0.55"
dirs = "7"
dunce = "1"
encoding_rs = "0.8"
harper-core = "2.11"
log = "0.4"
pdf_oxide = { version = "0.3", optional = true }
regex = "1.13"
reqwest = { version = "0.13", optional = true }
rumdl = "0.2"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
spellbook = "0.4"
strum = { version = "0.28.0", features = ["derive"] }
tauri = { version = "2.11", features = ["devtools", "protocol-asset"] }
tauri-plugin-clipboard-manager = "2.3"
tauri-plugin-dialog = "2.7"
tauri-plugin-fs = { version = "2.5", features = ["watch"] }
tauri-plugin-log = "2.9"
tauri-plugin-opener = "2.5"
tauri-plugin-shell = "2.3"
tauri-plugin-single-instance = "2.4"
tauri-plugin-store = "2.4"
tauri-plugin-updater = "2.11"
tauri-plugin-window-state = "2.4"
tokio = { version = "1", features = ["fs", "io-util", "sync"] }
toml = "1.1"
trash = "5.2"
unicode-segmentation = "1.13"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.56"

[features]
default = ["pdf-export", "spellcheck"]
pdf-export = ["dep:pdf_oxide"]
spellcheck = ["dep:reqwest"]

[profile.release]
strip = true
lto = "thin"
panic = "abort"
codegen-units = 1
