[advisories]
ignore = [
  "RUSTSEC-2024-0320",
  "RUSTSEC-2024-0370",
  "RUSTSEC-2025-0141",
  "RUSTSEC-2026-0192",
  "RUSTSEC-2024-0436",
  # No upstream fix: updater 2.14 pins zip 4 (Windows), harper-core 2.13 pins zip 8.6, rumdl 0.3 pulls serde_yaml -> unsafe-libyaml, tauri-plugin-opener 2.7 / single-instance 2.5 (latest) pull zbus 5 -> zvariant 5
  "RUSTSEC-2024-0449",
  "RUSTSEC-2026-0367",
  "RUSTSEC-2026-0368",
  "RUSTSEC-2026-0369",
  "RUSTSEC-2026-0370",
  "RUSTSEC-2026-0371",
  "RUSTSEC-2026-0372",
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "GPL-3.0-only",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "Zlib",
  "Unlicense",
  "CC0-1.0",
  "MPL-2.0",
  "0BSD",
  "CDLA-Permissive-2.0",
  "MITNFA",
  "Unicode-3.0",
  "Unicode-DFS-2016",
]
confidence-threshold = 0.8

[[licenses.clarify]]
name = "webpki-roots"
expression = "MPL-2.0"
license-files = [{ path = "LICENSE", hash = 0xfc2b1d0a }]

[[licenses.clarify]]
name = "ring"
expression = "MIT"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
