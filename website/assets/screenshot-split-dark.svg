<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-label="MarkdownRS split view, dark theme">
  <title>MarkdownRS split view</title>
  <defs>
    <linearGradient id="winbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#211e26"/>
      <stop offset="1" stop-color="#19161d"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="800" fill="#121014"/>
  <!-- Window -->
  <rect x="48" y="48" width="1184" height="704" rx="18" fill="url(#winbg)" stroke="#332e3b" stroke-width="2"/>
  <rect x="48" y="48" width="1184" height="52" rx="18" fill="#26222c"/>
  <rect x="48" y="84" width="1184" height="16" fill="#26222c"/>

  <!-- Traffic dots (Paul Rand primaries) -->
  <circle cx="92" cy="74" r="8" fill="#e4572e"/>
  <circle cx="116" cy="74" r="8" fill="#ffc857"/>
  <circle cx="140" cy="74" r="8" fill="#1f4e9c"/>

  <!-- Tabs -->
  <g font-family="ui-monospace, monospace" font-size="15">
    <rect x="176" y="56" width="240" height="44" fill="#19161d" rx="8"/>
    <circle cx="196" cy="78" r="4" fill="#7c5a73"/>
    <text x="208" y="82" fill="#e8e4ee">welcome.md</text>

    <rect x="420" y="56" width="190" height="44" fill="transparent" rx="8"/>
    <circle cx="440" cy="78" r="4" fill="#5a5563"/>
    <text x="452" y="82" fill="#8b8595">ideas.md</text>
  </g>
  <g font-family="ui-monospace, monospace" font-size="20" fill="#8b8595">
    <text x="1160" y="82" text-anchor="end">+</text>
  </g>

  <!-- Editor pane -->
  <g font-family="ui-monospace, monospace">
    <text x="84" y="150" fill="#4c4754" text-anchor="end">1</text>
    <text x="84" y="178" fill="#4c4754" text-anchor="end">2</text>
    <text x="84" y="206" fill="#4c4754" text-anchor="end">3</text>
    <text x="84" y="234" fill="#4c4754" text-anchor="end">4</text>
    <text x="84" y="262" fill="#4c4754" text-anchor="end">5</text>
    <text x="84" y="290" fill="#4c4754" text-anchor="end">6</text>
    <text x="84" y="318" fill="#4c4754" text-anchor="end">7</text>
    <text x="84" y="346" fill="#4c4754" text-anchor="end">8</text>
    <text x="84" y="374" fill="#4c4754" text-anchor="end">9</text>
    <text x="84" y="402" fill="#4c4754" text-anchor="end">10</text>
    <text x="84" y="430" fill="#4c4754" text-anchor="end">11</text>
    <text x="84" y="458" fill="#4c4754" text-anchor="end">12</text>
    <text x="84" y="486" fill="#4c4754" text-anchor="end">13</text>
    <text x="84" y="514" fill="#4c4754" text-anchor="end">14</text>
    <text x="84" y="542" fill="#4c4754" text-anchor="end">15</text>
    <text x="84" y="570" fill="#4c4754" text-anchor="end">16</text>
    <text x="84" y="598" fill="#4c4754" text-anchor="end">17</text>
    <text x="84" y="626" fill="#4c4754" text-anchor="end">18</text>
    <text x="84" y="654" fill="#4c4754" text-anchor="end">19</text>

    <text x="108" y="150" font-size="22" font-weight="700" fill="#c9a6c0"># Welcome to MarkdownRS</text>
    <text x="108" y="206" font-size="16" fill="#c9c4d2">MarkdownRS is a fast, native Markdown editor</text>
    <text x="108" y="230" font-size="16" fill="#c9c4d2">built with </text>
    <text x="198" y="230" font-size="16" font-weight="700" fill="#e8e4ee">Rust</text>
    <text x="252" y="230" font-size="16" fill="#c9c4d2">and </text>
    <text x="288" y="230" font-size="16" font-weight="700" fill="#e8e4ee">Tauri</text>
    <text x="348" y="230" font-size="16" fill="#c9c4d2">. No Electron.</text>
    <text x="108" y="254" font-size="16" fill="#c9c4d2">It launches in milliseconds and sips memory.</text>

    <text x="108" y="306" font-size="18" font-weight="700" fill="#c9a6c0">## Features</text>
    <text x="108" y="334" font-size="16" fill="#e8e4ee">-</text>
    <text x="124" y="334" font-size="16" fill="#c9c4d2"> Live preview, synchronized scrolling</text>
    <text x="108" y="358" font-size="16" fill="#e8e4ee">-</text>
    <text x="124" y="358" font-size="16" fill="#c9c4d2"> KaTeX math and Mermaid diagrams</text>
    <text x="108" y="382" font-size="16" fill="#e8e4ee">-</text>
    <text x="124" y="382" font-size="16" fill="#c9c4d2"> Command palette, custom shortcuts</text>

    <text x="108" y="434" font-size="18" font-weight="700" fill="#c9a6c0">## Code</text>
    <rect x="104" y="450" width="476" height="86" rx="8" fill="#141117"/>
    <g font-size="14" fill="#8f8a9c">
      <text x="120" y="474" fill="#d77ba4">```rust</text>
      <text x="120" y="496" fill="#8fc7ff">fn main</text>
      <text x="196" y="496" fill="#c9c4d2">() {</text>
      <text x="120" y="518" fill="#c9c4d2">    println!</text>
      <text x="228" y="518" fill="#8fc7ff">(</text>
      <text x="240" y="518" fill="#b9e07a">"hello"</text>
      <text x="300" y="518" fill="#8fc7ff">)</text>
      <text x="316" y="518" fill="#c9c4d2">;</text>
      <text x="120" y="540" fill="#c9c4d2">}</text>
    </g>
    <text x="120" y="556" font-size="14" fill="#d77ba4">```</text>

    <!-- Cursor -->
    <rect x="486" y="138" width="2" height="24" fill="#e8e4ee"/>
  </g>

  <!-- Divider -->
  <rect x="640" y="100" width="2" height="652" fill="#332e3b"/>

  <!-- Preview pane -->
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="676" y="154" font-size="30" font-weight="700" fill="#f0ecf5">Welcome to MarkdownRS</text>
    <rect x="676" y="168" width="70" height="4" fill="#7c5a73"/>
    <text x="676" y="206" font-size="16" fill="#a7a2b0">MarkdownRS is a fast, native Markdown editor built with</text>
    <text x="676" y="228" font-size="16" fill="#a7a2b0">Rust and Tauri. No Electron. Launches in milliseconds.</text>

    <text x="676" y="276" font-size="21" font-weight="700" fill="#e6e1ec">Features</text>
    <g font-size="15" fill="#a7a2b0">
      <rect x="676" y="292" width="7" height="7" fill="#7c5a73"/>
      <text x="692" y="300">Live preview, synchronized scrolling</text>
      <rect x="676" y="316" width="7" height="7" fill="#7c5a73"/>
      <text x="692" y="324">KaTeX math and Mermaid diagrams</text>
      <rect x="676" y="340" width="7" height="7" fill="#7c5a73"/>
      <text x="692" y="348">Command palette, custom shortcuts</text>
    </g>

    <text x="676" y="398" font-size="21" font-weight="700" fill="#e6e1ec">Code</text>
    <rect x="676" y="412" width="500" height="96" rx="8" fill="#141117"/>
    <g font-family="ui-monospace, monospace" font-size="14" fill="#8f8a9c">
      <text x="692" y="438" fill="#8fc7ff">fn main</text>
      <text x="768" y="438" fill="#c9c4d2">() {</text>
      <text x="692" y="460" fill="#c9c4d2">    println!</text>
      <text x="796" y="460" fill="#8fc7ff">(</text>
      <text x="808" y="460" fill="#b9e07a">"hello, markdownrs"</text>
      <text x="956" y="460" fill="#8fc7ff">)</text>
      <text x="972" y="460" fill="#c9c4d2">;</text>
      <text x="692" y="482" fill="#c9c4d2">}</text>
      <text x="692" y="504" fill="#8b8595">// → hello, markdownrs</text>
    </g>

    <text x="676" y="550" font-size="21" font-weight="700" fill="#e6e1ec">Math</text>
    <rect x="676" y="564" width="500" height="52" rx="8" fill="#241f2c"/>
    <g font-family="Georgia, serif" font-style="italic" font-size="17" fill="#e6e1ec">
      <text x="926" y="596" text-anchor="middle">e</text>
      <text x="944" y="590" font-size="12" fill="#a7a2b0">iπ</text>
      <text x="966" y="596">+ 1 = 0</text>
    </g>

    <text x="676" y="654" font-size="21" font-weight="700" fill="#e6e1ec">Diagram</text>
    <rect x="676" y="668" width="500" height="60" rx="8" fill="#1e1a25"/>
    <rect x="712" y="682" width="120" height="32" rx="6" fill="#2b2434" stroke="#7c5a73" stroke-width="1.5"/>
    <text x="772" y="703" text-anchor="middle" font-size="13" fill="#c9c4d2">Write</text>
    <rect x="900" y="682" width="120" height="32" rx="6" fill="#2b2434" stroke="#7c5a73" stroke-width="1.5"/>
    <text x="960" y="703" text-anchor="middle" font-size="13" fill="#c9c4d2">Preview</text>
    <path d="M 836 698 H 896" stroke="#7c5a73" stroke-width="2" marker-end="none"/>
    <polygon points="896,693 908,698 896,703" fill="#7c5a73"/>
  </g>
</svg>
