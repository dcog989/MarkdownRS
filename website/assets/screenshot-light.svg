<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1280 800"
  role="img"
  aria-label="MarkdownRS light theme with rendered math and diagrams"
>
  <title>MarkdownRS rendered preview</title>
  <defs>
    <linearGradient id="lwin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfaf7" />
      <stop offset="1" stop-color="#f2efe9" />
    </linearGradient>
  </defs>

  <rect width="1280" height="800" fill="#eae6de" />
  <!-- Window -->
  <rect x="48" y="48" width="1184" height="704" rx="18" fill="url(#lwin)" stroke="#d9d3c6" stroke-width="2" />
  <rect x="48" y="48" width="1184" height="52" rx="18" fill="#ffffff" />
  <rect x="48" y="84" width="1184" height="16" fill="#ffffff" />

  <circle cx="92" cy="74" r="8" fill="#e4572e" />
  <circle cx="116" cy="74" r="8" fill="#ffc857" />
  <circle cx="140" cy="74" r="8" fill="#1f4e9c" />

  <g font-family="ui-monospace, monospace" font-size="15">
    <rect x="176" y="56" width="240" height="44" fill="#f2efe9" rx="8" />
    <circle cx="196" cy="78" r="4" fill="#7c5a73" />
    <text x="208" y="82" fill="#2a2430">notes/launch.md</text>
  </g>

  <!-- Preview content -->
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="120" y="156" font-size="34" font-weight="700" fill="#201b26">Launch Checklist</text>
    <rect x="120" y="170" width="72" height="4" fill="#7c5a73" />
    <text x="120" y="210" font-size="16" fill="#55505c">A fast, native Markdown editor — no Electron.</text>

    <text x="120" y="258" font-size="21" font-weight="700" fill="#2a2430">Rendering pipeline</text>
    <g font-size="15" fill="#55505c">
      <rect x="120" y="274" width="7" height="7" fill="#e4572e" />
      <text x="136" y="282">comrak parses GFM + CommonMark in pure Rust</text>
      <rect x="120" y="298" width="7" height="7" fill="#ffc857" />
      <text x="136" y="306">KaTeX renders math, cached by expression hash</text>
      <rect x="120" y="322" width="7" height="7" fill="#1f4e9c" />
      <text x="136" y="330">Mermaid diagrams lazy-loaded only when present</text>
    </g>

    <!-- Math -->
    <text x="120" y="384" font-size="21" font-weight="700" fill="#2a2430">Math</text>
    <rect x="120" y="398" width="620" height="54" rx="8" fill="#ffffff" stroke="#e3ddcf" stroke-width="1.5" />
    <g font-family="Georgia, serif" font-style="italic" font-size="18" fill="#201b26">
      <text x="430" y="432" text-anchor="middle">∫</text>
      <text x="452" y="432">0</text>
      <text x="466" y="414" font-size="12">∞</text>
      <text x="492" y="432">e</text>
      <text x="508" y="426" font-size="12" fill="#7c5a73">−x</text>
      <text x="528" y="432">²</text>
      <text x="548" y="432">dx =</text>
      <text x="588" y="432">√π / 2</text>
    </g>

    <!-- Mermaid -->
    <text x="120" y="492" font-size="21" font-weight="700" fill="#2a2430">Diagram</text>
    <rect x="120" y="506" width="620" height="120" rx="8" fill="#ffffff" stroke="#e3ddcf" stroke-width="1.5" />
    <g font-size="13">
      <rect x="160" y="528" width="120" height="34" rx="8" fill="#f0e9ef" stroke="#7c5a73" stroke-width="1.5" />
      <text x="220" y="550" text-anchor="middle" fill="#3a2f3c">Write</text>
      <rect x="350" y="528" width="120" height="34" rx="8" fill="#f0e9ef" stroke="#7c5a73" stroke-width="1.5" />
      <text x="410" y="550" text-anchor="middle" fill="#3a2f3c">Parse</text>
      <rect x="540" y="528" width="140" height="34" rx="8" fill="#7c5a73" />
      <text x="610" y="550" text-anchor="middle" fill="#ffffff">Render</text>
      <polygon points="280,545 292,550 280,555" fill="#7c5a73" />
      <polygon points="470,545 482,550 470,555" fill="#7c5a73" />
      <path d="M 220 562 V 590" stroke="#7c5a73" stroke-width="1.5" fill="none" />
      <rect x="160" y="590" width="120" height="24" rx="12" fill="#f3f0ea" stroke="#d9d3c6" stroke-width="1" />
      <text x="220" y="607" text-anchor="middle" fill="#8a8591">hot reload</text>
    </g>
  </g>

  <!-- Minimap -->
  <rect x="1150" y="100" width="82" height="652" fill="#efece5" />
  <rect x="1150" y="100" width="2" height="652" fill="#d9d3c6" />
  <g fill="#b9b3a6">
    <rect x="1162" y="130" width="58" height="8" rx="2" />
    <rect x="1162" y="152" width="40" height="4" rx="1" />
    <rect x="1162" y="164" width="46" height="4" rx="1" />
    <rect x="1162" y="176" width="34" height="4" rx="1" />
    <rect x="1162" y="196" width="54" height="8" rx="2" />
    <rect x="1162" y="218" width="38" height="4" rx="1" />
    <rect x="1162" y="238" width="58" height="8" rx="2" />
    <rect x="1162" y="260" width="30" height="4" rx="1" />
    <rect x="1162" y="280" width="58" height="8" rx="2" />
    <rect x="1162" y="302" width="44" height="4" rx="1" />
  </g>
  <rect
    x="1156"
    y="126"
    width="70"
    height="110"
    rx="4"
    fill="#7c5a73"
    opacity="0.18"
    stroke="#7c5a73"
    stroke-width="1.5"
  />

  <!-- Status bar -->
  <rect x="48" y="736" width="1184" height="16" fill="#ffffff" stroke="#e3ddcf" stroke-width="1" />
  <text x="72" y="748" font-family="ui-monospace, monospace" font-size="12" fill="#8a8591">
    notes/launch.md — 1,024 words · Saved · GFM
  </text>
  <text x="1150" y="748" text-anchor="end" font-family="ui-monospace, monospace" font-size="12" fill="#8a8591">
    Rendered mode
  </text>
</svg>
