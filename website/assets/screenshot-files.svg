    <text x="468" y="150" font-size="14" fill="#8fc7ff">Preview</text>
    <text x="536" y="150" font-size="14" fill="#c9c4d2">from</text>
    <text x="580" y="150" font-size="14" fill="#b9e07a">"./Preview.svelte"</text>
    <text x="742" y="150" font-size="14" fill="#c9c4d2">;</text>

    <text x="406" y="178" font-size="14" fill="#8b8595">// Renders the live Markdown preview pane</text>
    <text x="406" y="206" font-size="14" fill="#c9c4d2">const isMarkdown = </text>
    <text x="578" y="206" font-size="14" fill="#7d5a76">$derived</text>
    <text x="652" y="206" font-size="14" fill="#c9c4d2">(</text>
    <text x="662" y="206" font-size="14" fill="#8fc7ff">path</text>
    <text x="706" y="206" font-size="14" fill="#c9c4d2">.endsWith(</text>
    <text x="790" y="206" font-size="14" fill="#b9e07a">'.md'</text>
    <text x="830" y="206" font-size="14" fill="#c9c4d2">));</text>

    <text x="406" y="262" font-size="14" fill="#7d5a76">&lt;Preview</text>
    <text x="476" y="262" font-size="14" fill="#8fc7ff">tabId</text>
    <text x="516" y="262" font-size="14" fill="#c9c4d2">=</text>
    <text x="528" y="262" font-size="14" fill="#c9c4d2">{</text>
    <text x="540" y="262" font-size="14" fill="#8fc7ff">activeTabId</text>
    <text x="616" y="262" font-size="14" fill="#c9c4d2">} /&gt;</text>
    <text x="406" y="290" font-size="14" fill="#8b8595">// ↑ renders markdown → html with comrak</text>
