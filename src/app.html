<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">

    <!-- ! Critical CSS: Prevents FOUC -->
    <style>
    /* No background: the window's own background shows through until the
       frontend has loaded the theme, so there is no wrong-colour frame. */
    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }
    </style>

    %sveltekit.head%
  </head>

  <body data-sveltekit-preload-data="hover">
    <div style="height: 100%; display: flex; flex-direction: column">%sveltekit.body%</div>
  </body>
</html>
